project:
  type: website
  # output directory used on gh-pages branch. format: YYMM
  output-dir: "2705"
  render: 
    - "!README.md"
    - "!LICENSE"
    - "!LICENSE.md"
    - "!scripts"
    - "!tmprepo"
    - "!*.Rmd"
    - "!*.md"
    - "*.qmd"
    - "404.md"

website:
  open-graph: true
  site-url: "https://nbisweden.github.io/workshop-data-visualization-r/"
  description: "Publication ready data visualization using R, Quarto, Shiny apps and more"
  image: "assets/images/banner.webp"
  favicon: "assets/favicon.png"
  navbar:
    logo: "assets/logos/nbis-scilifelab.png"
    logo-alt: "logo"
    right:
      - text: "Home"
        href: "index.html"
      - text: "Schedule"
        href: "home_schedule.html"
      - text: "Contents"
        href: "home_contents.html"
      - text: "Precourse"
        href: "home_precourse.html"
      - text: "Syllabus"
        href: "home_syllabus.html"
      - text: "FAQs"
        href: "home_faq.html"
      - text: "Info"
        href: "home_info.html"
      - icon: "github"
        href: "https://github.com/NBISweden/workshop-data-visualization-r/"
  page-footer:
    border: false
    left: "{{< meta current_year >}} [NBIS](https://nbis.se) • [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
    right: "Published with [Quarto](https://quarto.org/) v{{< meta quarto_version >}}"

format:
  html:
    quarto-required: ">=1.8.26"
    include-in-header: "assets/include_head.html"
    theme: "assets/css/styles.scss"
    smooth-scroll: true
    toc: true
    toc-depth: 4
    toc-location: right
    number-sections: true
    number-depth: 4
    code-fold: false
    code-tools: false
    code-copy: true
    code-overflow: wrap
    df-print: paged
    standalone: false
    fig-align: left
    title-block-banner: "assets/images/banner.webp"
    callout-icon: true
    date:  last-modified
    date-format: "DD-MMM-YYYY"
    lightbox: auto
  revealjs:
    quarto-required: ">=1.8.26"
    include-in-header: "assets/include_head.html"
    theme: ["default","assets/css/slides.scss"]
    df-print: paged
    width: 1280
    height: 720
    transition: "fade"
    transition-speed: "fast"
    smaller: false
    incremental: false
    scrollable: false
    slide-level: 2
    slide-number: true
    progress: true
    date:  last-modified
    date-format: "DD-MMM-YYYY"
    fig-align: left
    chalkboard: true
    callout-icon: true
    hero: "assets/images/slide-hero.webp"
    title-slide-attributes:
      data-background-image: "assets/images/cover.webp"
      data-background-size: "cover"
      data-background-opacity: "1"
    header-logo-left: assets/logos/nbis.png
    header-logo-left-height: 25px
    header-logo-left-url: "https://nbisweden.github.io/workshop-data-visualization-r/2705/home_contents.html"
    header-logo-right: /assets/logos/scilifelab.png
    header-logo-right-height: 25px
    header-logo-right-url: "https://nbisweden.github.io/workshop-data-visualization-r/2705/home_contents.html"
    template-partials:
      - "assets/title-slide.html"
    pointer:
      color: "#95b540"
      pointerSize: 12
      trail: true
      trailDuration: 250

bibliography: references.bib
csl: apa.csl

knitr:
  opts_chunk:
    results: hold

execute:
  eval: true
  echo: true
  warning: false
  message: false
  freeze: true

metadata-files:
  - "_metadata.yml"

filters:
  - assets/custom.lua
  - revealjs-header

revealjs-plugins:
  - pointer

